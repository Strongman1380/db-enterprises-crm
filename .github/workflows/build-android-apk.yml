name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/db-enterprises-crm.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-enterprises-crm-android
          path: android/app/build/outputs/apk/debug/db-enterprises-crm.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: android-v${{ github.run_number }}
          name: "DB Enterprises CRM – Android v${{ github.run_number }}"
          body: |
            ## Install on Android

            1. Download **db-enterprises-crm.apk** below
            2. On your Android phone, open **Settings → Security** and enable **Install unknown apps** for your browser or Files app
            3. Open the downloaded APK and tap **Install**
            4. Launch **DB Enterprises CRM** from your app drawer

            > Requires Android 7.0 (API 24) or later.
          artifacts: android/app/build/outputs/apk/debug/db-enterprises-crm.apk
          artifactContentType: application/vnd.android.package-archive
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: false
          draft: false
          prerelease: false
